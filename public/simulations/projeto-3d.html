<style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
// Visualizador 3D de um projeto do ARGUS.LLP (Layout + Fluxo). Recebe o projeto do editor via
// postMessage (aba 3D) ou, aberto em outra aba, do localStorage. O editor continua 2D: isto só lê.
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'

const STORAGE_KEY = 'argus:3d-project'
const ROOF_H = 9
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const wrap = (a) => ((((a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI
const angDiff = (a, b) => wrap(a - b)
function hash(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
function rng(seed) { let a = seed; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }

// Cores do app (src/shared/lib/colors.ts e types/flow.ts)
const AREA_COLORS = { receiving: '#0D9488', shipping: '#2563EB', picking: '#7C3AED', staging: '#D97706', quarantine: '#DC2626',
  returns: '#DB2777', storage: '#B45309', circulation: '#64748B', administrative: '#0EA5E9', custom: '#334155', inspection: '#0EA5E9' }
const AREA_LABELS = { receiving: 'Recebimento', shipping: 'Expedição', picking: 'Picking', staging: 'Staging', quarantine: 'Quarentena',
  returns: 'Devolução', storage: 'Armazenagem', circulation: 'Circulação', administrative: 'Administrativo', custom: 'Área', inspection: 'Conferência' }
const AREA_SUBTYPE = { 'area-picking': 'picking', 'area-staging': 'staging', 'area-inspection': 'inspection', 'area-shipping': 'shipping', 'area-receiving': 'receiving' }
const PALLET_COLORS = ['#c8a97e', '#b98f5c', '#d6c29a', '#a77b4f', '#9fb7c9', '#bfa58a']

// ---------------------------------------------------------------- renderer / cena
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight)
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05
document.getElementById('app').appendChild(renderer.domElement)
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') })
labelRenderer.setSize(innerWidth, innerHeight)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#a9bccf')
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 1000)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49
scene.add(new THREE.HemisphereLight('#ffffff', '#6b7280', 1.6))
const sun = new THREE.DirectionalLight('#ffffff', 1.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048)
scene.add(sun, sun.target)
// reflexos suaves de um ambiente interno: metais e plásticos deixam de parecer chapados
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.35
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: '#7c8a76' }))
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground)

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o })
let root = new THREE.Group(); scene.add(root)
let W = 40, D = 30
let obstacles = []   // OBB: { cx, cz, hw, hl, c, s }
let agents = []
let conveyorItems = []
let roof = null
let stats = { objects: 0, positions: 0, routes: 0, unlinked: 0 }
let objInfo = []   // { id, o, f, h } — usado para selecionar/editar no 3D

// ---------------------------------------------------------------- caixas instanciadas (estática inteira em 1 draw call)
const unitBox = new THREE.BoxGeometry(1, 1, 1)
let boxes = []
// Pallets são entidades (podem ser pegos e movidos); as posições de rack/piso onde podem
// ficar são "slots". Pallets parados são instâncias; o que está no garfo vira malha própria.
let pallets = [], slots = [], palletInst = null, carrying = null
function toWorld(f, x, z) { return { x: f.cx + x * Math.cos(f.th) + z * Math.sin(f.th), z: f.cz - x * Math.sin(f.th) + z * Math.cos(f.th) } }
function addSlot(f, x, y, z) { const w = toWorld(f, x, z); const sl = { x: w.x, y, z: w.z, rot: f.th, pallet: null }; slots.push(sl); return sl }
function addPallet(f, x, y, z, w, d, lh, color, slot = null) {
  const p = toWorld(f, x, z)
  const pl = { x: p.x, y, z: p.z, rot: f.th, w, d, lh, color, slot, mesh: null, idx: pallets.length }
  if (slot) slot.pallet = pl
  pallets.push(pl); return pl
}
const _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color()
function objFrame(o) {
  const w = o.width / 100, l = o.length / 100
  const th = -THREE.MathUtils.degToRad(o.rotationDeg || 0)
  const cx = (o.x + o.width / 2) / 100, cz = (o.y + o.length / 2) / 100
  return { w, l, th, cx, cz, m: new THREE.Matrix4().compose(_p.set(cx, 0, cz), _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), th), _s.set(1, 1, 1)) }
}
function B(f, x, y, z, sx, sy, sz, color) {   // caixa no referencial do objeto; y = base
  const local = new THREE.Matrix4().compose(_p.set(x, y + sy / 2, z), _q.identity(), _s.set(sx, sy, sz))
  boxes.push([f.m.clone().multiply(local), color])
}
function flushBoxes() {
  const im = new THREE.InstancedMesh(unitBox, M('#ffffff'), Math.max(1, boxes.length))
  boxes.forEach(([m, c], i) => { im.setMatrixAt(i, m); im.setColorAt(i, _c.set(c)) })
  im.count = boxes.length; im.castShadow = im.receiveShadow = true
  root.add(im)
}
const woodMat = M('#8B5E34', { roughness: 0.9 })
// Pallet de madeira com tábuas, tacos e longarinas, numa caixa unitária (-0,5..0,5) para poder
// ser escalado por instância como a caixa simples era.
const palletGeo = (() => {
  const parts = []
  const add = (x, y, z, sx, sy, sz) => parts.push(new THREE.BoxGeometry(sx, sy, sz).translate(x, y, z))
  for (const x of [-0.45, 0, 0.45]) add(x, -0.43, 0, 0.12, 0.14, 1)                         // tábuas de fundo
  for (const x of [-0.45, 0, 0.45]) for (const z of [-0.43, 0, 0.43]) add(x, -0.09, z, 0.12, 0.55, 0.14)   // tacos
  for (const z of [-0.43, 0, 0.43]) add(0, 0.25, z, 1, 0.16, 0.14)                          // travessas
  for (let k = 0; k < 7; k++) add(-0.45 + k * 0.15, 0.42, 0, 0.11, 0.16, 1)                 // tábuas do tampo
  return mergeGeometries(parts)
})()
function palletMatrices(p, base, load) {
  _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), p.rot)
  base.compose(_p.set(p.x, p.y + 0.07, p.z), _q, _s.set(p.w, 0.14, p.d))
  load.compose(_p.set(p.x, p.y + 0.14 + p.lh / 2, p.z), _q, _s.set(p.w - 0.05, p.lh, p.d - 0.1))
}
// ---------------------------------------------------------------- modelos realistas (OpenUSD)
// Modelos SimReady da NVIDIA (CC BY 4.0), lidos pelo @huggingface/usd-web-viewer (servido de
// /vendor). Tudo é opcional: se o download ou a leitura falhar, fica o modelo próprio.
const USD_BASE = 'https://huggingface.co/datasets/nvidia/PhysicalAI-SimReady-Warehouse-01/resolve/main/'
const USD_MODELS = {
  pallet: 'Props/assembly/Pallets_A1/Pallets_A1.usd',
  box: 'Props/general/Cardbox_A1/Cardbox_A1.usd',
}
const USD_KEY = 'argus:usd-models'
const usdModels = {}           // tipo → { template, bb } (só os que carregaram)
let usdState = 'off'           // off | loading | ready
let usdEnabled = true
try { usdEnabled = localStorage.getItem(USD_KEY) !== 'off' } catch { /* sem armazenamento: padrão ligado */ }
const usdModel = (type) => (usdEnabled ? usdModels[type] : null)
// Matriz que encaixa o modelo na caixa do objeto: base no piso, centralizado, girado 90° se o
// lado comprido do modelo estiver no eixo errado; h = null mantém a proporção da altura.
function fitMatrix(model, w, h, d) {
  const size = model.bb.getSize(new THREE.Vector3()), c = model.bb.getCenter(new THREE.Vector3())
  const rot = Math.abs(size.x - size.z) > 0.05 * Math.max(size.x, size.z) && (size.x > size.z) !== (w > d)
  const sx = rot ? size.z : size.x, sz = rot ? size.x : size.z
  const kx = w / sx, kz = d / sz, ky = h ? h / size.y : (kx + kz) / 2
  return new THREE.Matrix4().makeScale(kx, ky, kz)
    .multiply(rot ? new THREE.Matrix4().makeRotationY(Math.PI / 2) : new THREE.Matrix4())
    .multiply(new THREE.Matrix4().makeTranslation(-c.x, -model.bb.min.y, -c.z))
}
function modelParts(model) {   // malhas do modelo com a matriz relativa à raiz
  const parts = []
  model.template.traverse((m) => { if (m.isMesh) parts.push({ geometry: m.geometry, material: m.material, local: m.matrixWorld.clone() }) })
  return parts
}
function modelInstance(model, fit) {   // cópia avulsa (ex.: pallet no garfo, caixa)
  const g = new THREE.Group()
  for (const pt of modelParts(model)) {
    const m = new THREE.Mesh(pt.geometry, pt.material); m.matrixAutoUpdate = false
    m.matrix.copy(fit).multiply(pt.local); m.castShadow = m.receiveShadow = true; g.add(m)
  }
  return g
}
async function loadUsdModels() {
  if (usdState !== 'off') return
  usdState = 'loading'; usdStatus()
  let lib
  try { lib = await import('../vendor/usd-web-viewer/esm/index.js') } catch (e) { console.warn('Leitor USD indisponível', e); usdState = 'ready'; usdStatus(); return }
  await Promise.all(Object.entries(USD_MODELS).map(async ([type, path]) => {
    try {
      const { root: r, complete } = await lib.loadUsd(USD_BASE + path, { textures: 'preview', maxTextureSize: 512 })
      await complete.catch(() => {})
      r.updateMatrixWorld(true)
      const bb = new THREE.Box3().setFromObject(r)
      if (bb.isEmpty()) throw new Error('modelo vazio')
      usdModels[type] = { template: r, bb }
    } catch (e) { console.warn(`Modelo USD de "${type}" não carregou; usando o modelo próprio`, e) }
  }))
  usdState = 'ready'; usdStatus()
  if (project && Object.keys(usdModels).length) build(project)
}
function usdStatus() {
  const el = document.getElementById('i-usd'), btn = document.getElementById('t-usd')
  btn.classList.toggle('on', usdEnabled)
  const names = { pallet: 'pallet', box: 'caixa' }
  const ok = Object.keys(usdModels).map((t) => names[t] || t)
  const credit = 'Modelos 3D: <a href="https://huggingface.co/datasets/nvidia/PhysicalAI-SimReady-Warehouse-01" target="_blank" rel="noopener">NVIDIA SimReady Warehouse</a> (CC BY 4.0)'
  el.innerHTML = !usdEnabled ? 'Modelos NVIDIA desligados — usando os modelos próprios.'
    : usdState === 'loading' ? 'Carregando modelos NVIDIA…'
    : ok.length ? `Modelos NVIDIA ativos: ${ok.join(', ')}.<br>${credit}`
    : usdState === 'ready' ? 'Modelos NVIDIA indisponíveis — usando os modelos próprios.' : ''
}

function buildPallets() {
  const n = Math.max(1, pallets.length)
  const base = new THREE.InstancedMesh(palletGeo, woodMat, n), load = new THREE.InstancedMesh(unitBox, M('#ffffff', { roughness: 0.75 }), n)
  const mb = new THREE.Matrix4(), ml = new THREE.Matrix4()
  pallets.forEach((p, i) => { palletMatrices(p, mb, ml); base.setMatrixAt(i, mb); load.setMatrixAt(i, ml); load.setColorAt(i, _c.set(p.color)) })
  base.count = load.count = pallets.length
  for (const im of [base, load]) { im.castShadow = im.receiveShadow = true; root.add(im) }
  palletInst = { base, load, extra: [] }
  const model = usdModel('pallet')
  if (model) {   // troca a base própria pelas malhas do modelo, instanciadas do mesmo jeito
    base.visible = false
    for (const pt of modelParts(model)) {
      const im = new THREE.InstancedMesh(pt.geometry, pt.material, n); im.castShadow = im.receiveShadow = true
      palletInst.extra.push({ im, local: pt.local }); root.add(im)
    }
    pallets.forEach((p, i) => setExtra(p, i, false))
    for (const e of palletInst.extra) e.im.count = pallets.length
  }
}
function palletFit(p) { return fitMatrix(usdModel('pallet'), p.w, 0.144, p.d) }
function setExtra(p, i, hidden) {
  if (!palletInst.extra.length) return
  const world = hidden ? null : new THREE.Matrix4().compose(_p.set(p.x, p.y, p.z), _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), p.rot), _s.set(1, 1, 1)).multiply(palletFit(p))
  for (const e of palletInst.extra) { e.im.setMatrixAt(i, hidden ? ZERO : world.clone().multiply(e.local)); e.im.instanceMatrix.needsUpdate = true }
}
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0)
function hideInstance(p) { palletInst.base.setMatrixAt(p.idx, ZERO); palletInst.load.setMatrixAt(p.idx, ZERO); palletInst.base.instanceMatrix.needsUpdate = palletInst.load.instanceMatrix.needsUpdate = true; setExtra(p, p.idx, true) }
function showInstance(p) {

// ---------------------------------------------------------------- grade de navegação + A*
const CELL = 0.5
let grid = null, GW = 0, GD = 0
function insideOBB(x, z, b, r = 0) {
  const dx = x - b.cx, dz = z - b.cz
  const lx = dx * b.c + dz * b.s, lz = -dx * b.s + dz * b.c   // referencial local do objeto
  return Math.abs(lx) <= b.hw + r && Math.abs(lz) <= b.hl + r
}
function buildGrid() {
  GW = Math.ceil(W / CELL); GD = Math.ceil(D / CELL); grid = new Uint8Array(GW * GD)
  for (let j = 0; j < GD; j++) for (let i = 0; i < GW; i++) {
    const x = (i + 0.5) * CELL, z = (j + 0.5) * CELL
    grid[j * GW + i] = obstacles.some((b) => insideOBB(x, z, b, 0.45)) ? 1 : 0
  }
}
function nearestFree(x, z) {
  const ci = clamp(Math.floor(x / CELL), 0, GW - 1), cj = clamp(Math.floor(z / CELL), 0, GD - 1)
  for (let r = 0; r < Math.max(GW, GD); r++) {
    let best = null, bd = Infinity
    for (let j = cj - r; j <= cj + r; j++) for (let i = ci - r; i <= ci + r; i++) {
      if (i < 0 || j < 0 || i >= GW || j >= GD || grid[j * GW + i]) continue
      const d = Math.hypot(i - ci, j - cj); if (d < bd) { bd = d; best = [i, j] }
    }
    if (best) return best
  }
  return null
}
function astar(a, b) {
  const s = nearestFree(a.x, a.z), t = nearestFree(b.x, b.z)
  if (!s || !t) return null
  const N = GW * GD, g = new Float32Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1), closed = new Uint8Array(N)
  const heap = [] // [f, idx]
  const push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p } }
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m } } return top }
  const si = s[1] * GW + s[0], ti = t[1] * GW + t[0]
  g[si] = 0; push(0, si)
  while (heap.length) {
    const [, u] = pop(); if (closed[u]) continue; closed[u] = 1
    if (u === ti) break
    const ui = u % GW, uj = (u / GW) | 0
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue
      const vi = ui + di, vj = uj + dj; if (vi < 0 || vj < 0 || vi >= GW || vj >= GD) continue
      const v = vj * GW + vi; if (grid[v] || closed[v]) continue
      if (di && dj && (grid[uj * GW + vi] || grid[vj * GW + ui])) continue
      const ng = g[u] + (di && dj ? 1.4142 : 1)
      if (ng < g[v]) { g[v] = ng; prev[v] = u; push(ng + Math.hypot(vi - t[0], vj - t[1]), v) }
    }
  }
  if (prev[ti] < 0 && si !== ti) return null
  const cells = []; for (let u = ti; u >= 0; u = prev[u]) cells.unshift(u)
  const pts = cells.map((u) => ({ x: ((u % GW) + 0.5) * CELL, z: (((u / GW) | 0) + 0.5) * CELL }))
  // simplificação por linha de visada na grade
  const out = [pts[0]]
  let k = 0
  while (k < pts.length - 1) {
    let far = k + 1
    for (let m = pts.length - 1; m > k + 1; m--) if (clearLine(pts[k], pts[m])) { far = m; break }
    out.push(pts[far]); k = far
  }
  return out
}
function clearLine(a, b) {
  const n = Math.ceil(Math.hypot(b.x - a.x, b.z - a.z) / (CELL * 0.5))
  for (let k = 0; k <= n; k++) {
    const x = a.x + (b.x - a.x) * k / n, z = a.z + (b.z - a.z) * k / n
    const i = Math.floor(x / CELL), j = Math.floor(z / CELL)
    if (i < 0 || j < 0 || i >= GW || j >= GD || grid[j * GW + i]) return false
  }
  return true
}

// Rotas do Fluxo: cada conexão entre etapas vinculadas a objetos vira um agente indo e voltando
function buildAgents(project, objects) {
  const byId = new Map(objects.map((o) => [o.id, o]))
  const nodes = new Map((project.flowNodes || []).map((n) => [n.id, n]))
  for (const c of project.flowConnections || []) {
    const a = byId.get(nodes.get(c.fromNodeId)?.linkedObjectId), b = byId.get(nodes.get(c.toNodeId)?.linkedObjectId)
    if (!a || !b) { stats.unlinked++; continue }
    const fa = objFrame(a), fb = objFrame(b)
    const path = astar({ x: fa.cx, z: fa.cz }, { x: fb.cx, z: fb.cz })

const ghostFill = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), new THREE.MeshBasicMaterial({ color: '#22c55e', transparent: true, opacity: 0.18, depthWrite: false }))
ghost.add(ghostFill); scene.add(selBox, ghost)
let selectedId = null, drag = null
const TYPE_LABEL = { rack: 'Porta-paletes', 'drive-in': 'Drive-in', 'push-back': 'Push-back', 'flow-rack': 'Flow rack', cantilever: 'Cantilever', shelf: 'Estante',
  'storage-block': 'Blocado', pallet: 'Pallet', forklift: 'Empilhadeira', 'reach-truck': 'Reach truck', 'order-picker': 'Selecionadora', conveyor: 'Esteira',
  column: 'Coluna', wall: 'Parede', door: 'Porta', gate: 'Portão', dock: 'Doca', area: 'Área', 'area-picking': 'Área de picking', 'area-shipping': 'Área de expedição',
  'area-receiving': 'Área de recebimento', 'area-staging': 'Staging', 'area-inspection': 'Conferência', 'pedestrian-lane': 'Faixa de pedestres', 'traffic-lane': 'Faixa de tráfego',
  'fire-extinguisher': 'Extintor', 'fire-hydrant': 'Hidrante', 'emergency-exit': 'Saída de emergência', 'emergency-light': 'Iluminação de emergência', eyewash: 'Lava-olhos' }
function send(op, data = {}) { if (embedded) parent.postMessage({ type: 'argus:edit', op, ...data }, location.origin) }
function placeBox(b, f, h) { b.position.set(f.cx, 0, f.cz); b.rotation.set(0, f.th, 0); b.scale.set(f.w + 0.1, Math.max(h, 0.05) + 0.05, f.l + 0.1) }
function refreshSelection() {
  const info = objInfo.find((i) => i.id === selectedId)
  if (!info) selectedId = null
  selBox.visible = mode === 'edit' && !!info
  if (info) placeBox(selBox, info.f, info.h)
  document.getElementById('e-name').textContent = info ? (info.o.name || TYPE_LABEL[info.o.objectType] || info.o.objectType) : 'Nenhum objeto selecionado'
  document.getElementById('e-meta').textContent = info
    ? `${TYPE_LABEL[info.o.objectType] || info.o.objectType} · ${(info.o.width / 100).toFixed(2)} × ${(info.o.length / 100).toFixed(2)} m · ${Math.round(info.o.rotationDeg || 0)}°`
    : 'Clique em um objeto para selecionar · arraste para mover'
  for (const id of ['e-rotl', 'e-rotr', 'e-dup', 'e-del']) document.getElementById(id).disabled = !info
}
function select(id) { selectedId = id; refreshSelection(); send('select', { id }) }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()
function rayFrom(e) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray }
function hitObject(r) {
  // raio contra a caixa orientada de cada objeto (no referencial local); objetos baixos (áreas)
  // perdem para os que estão em cima deles
  let best = null, bt = Infinity
  for (const i of objInfo) {
    const c = Math.cos(-i.f.th), sn = Math.sin(-i.f.th)
    const ox = r.origin.x - i.f.cx, oz = r.origin.z - i.f.cz, dx = r.direction.x, dz = r.direction.z
    const o = [ox * c + oz * sn, r.origin.y, -ox * sn + oz * c], d = [dx * c + dz * sn, r.direction.y, -dx * sn + dz * c]
    const lo = [-i.f.w / 2, 0, -i.f.l / 2], hi = [i.f.w / 2, Math.max(i.h, 0.05), i.f.l / 2]
    let t0 = 0, t1 = Infinity
    for (let k = 0; k < 3; k++) {
      if (Math.abs(d[k]) < 1e-9) { if (o[k] < lo[k] || o[k] > hi[k]) { t0 = Infinity; break } continue }
      let a = (lo[k] - o[k]) / d[k], b = (hi[k] - o[k]) / d[k]; if (a > b) [a, b] = [b, a]
      t0 = Math.max(t0, a); t1 = Math.min(t1, b)
    }
    if (t0 > t1 || t0 === Infinity) continue
    const score = t0 + (i.h <= 0.05 ? 1000 : 0)
    if (score < bt) { bt = score; best = i }
  }
  return best
}
function groundPoint(r) { if (r.direction.y >= -1e-6) return null; const t = -r.origin.y / r.direction.y; return { x: r.origin.x + r.direction.x * t, z: r.origin.z + r.direction.z * t } }
const snap = (v) => Math.round(v * 10) / 10   // 10 cm
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'edit' || e.button !== 0) return
  const r = rayFrom(e), hit = hitObject(r)
  drag = { sx: e.clientX, sy: e.clientY, info: hit, moved: false }
  if (hit) {
    if (hit.id !== selectedId) select(hit.id)
    const g = groundPoint(r)
    if (g) { drag.off = { x: hit.f.cx - g.x, z: hit.f.cz - g.z }; controls.enabled = false }
  }
}, true)
addEventListener('pointermove', (e) => {
  if (mode !== 'edit' || !drag?.info || !drag.off) return
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true
  if (!drag.moved) return
  const g = groundPoint(rayFrom(e)); if (!g) return
  const i = drag.info
  // mantém o objeto inteiro dentro do ambiente (meia-extensão da caixa girada)
  const c = Math.abs(Math.cos(i.f.th)), sn = Math.abs(Math.sin(i.f.th))
  const hx = Math.min(W / 2, (i.f.w * c + i.f.l * sn) / 2), hz = Math.min(D / 2, (i.f.w * sn + i.f.l * c) / 2)
  drag.cx = clamp(snap(g.x + drag.off.x), hx, W - hx); drag.cz = clamp(snap(g.z + drag.off.z), hz, D - hz)
  placeBox(ghost, { ...i.f, cx: drag.cx, cz: drag.cz }, i.h); ghost.visible = true
})
addEventListener('pointerup', (e) => {
  if (mode !== 'edit' || !drag) return
  const d = drag; drag = null; ghost.visible = false; controls.enabled = true
  if (d.info && d.moved && d.cx != null) {
    const o = d.info.o
    send('move', { id: o.id, x: Math.round(d.cx * 100 - o.width / 2), y: Math.round(d.cz * 100 - o.length / 2) })
    selBox.position.set(d.cx, 0, d.cz)   // resposta imediata; o projeto atualizado chega em seguida
  } else if (!d.info && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 5) select(null)
})
const editAct = {
  rotl: () => selectedId && send('rotate', { id: selectedId, deltaDeg: -90 }),
  rotr: () => selectedId && send('rotate', { id: selectedId, deltaDeg: 90 }),
  dup: () => selectedId && send('duplicate', { id: selectedId }),
  del: () => { if (selectedId) { send('delete', { id: selectedId }); selectedId = null; refreshSelection() } },
}
document.getElementById('e-rotl').onclick = editAct.rotl
document.getElementById('e-rotr').onclick = editAct.rotr
document.getElementById('e-dup').onclick = editAct.dup
document.getElementById('e-del').onclick = editAct.del
document.getElementById('e-undo').onclick = () => send('undo')
document.getElementById('e-redo').onclick = () => send('redo')
document.getElementById('e-add').onchange = (e) => {
  const type = e.target.value; e.target.value = ''
  if (!type) return
  // insere no ponto do piso no centro da tela (ou no centro do ambiente)
  ndc.set(0, 0); ray.setFromCamera(ndc, camera)
  const g = groundPoint(ray.ray) || { x: W / 2, z: D / 2 }
  send('add', { objectType: type, x: Math.round(clamp(g.x, 0, W) * 100), y: Math.round(clamp(g.z, 0, D) * 100) })
}
addEventListener('keydown', (e) => {
  if (mode !== 'edit' || e.target.tagName === 'SELECT') return
  const mod = e.ctrlKey || e.metaKey
  if (mod && e.code === 'KeyZ') { e.preventDefault(); send(e.shiftKey ? 'redo' : 'undo') }
  else if (mod && e.code === 'KeyY') { e.preventDefault(); send('redo') }
  else if (mod && e.code === 'KeyD') { e.preventDefault(); editAct.dup() }
  else if (e.code === 'Delete' || e.code === 'Backspace') { e.preventDefault(); editAct.del() }
  else if (e.code === 'KeyQ') editAct.rotl()
  else if (e.code === 'KeyE') editAct.rotr()
  else if (e.code === 'Escape') select(null)
})
addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.data?.type !== 'argus:selection') return
  if (e.data.id !== selectedId) { selectedId = e.data.id; refreshSelection() }
})
if (embedded) document.getElementById('editBtn').style.display = ''

// ---------------------------------------------------------------- dados: editor → visualizador
let project = null, firstBuild = true
function load(p) {
  if (!p || !Array.isArray(p.objects)) return
  project = p
  document.getElementById('empty').style.display = 'none'
  build(p)
  if (usdEnabled) loadUsdModels()
  if (firstBuild) { resetCamera('orbit'); setMode('orbit'); firstBuild = false }
}
addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.data?.type !== 'argus:project') return
  load(e.data.project)
})
try { const s = localStorage.getItem(STORAGE_KEY); if (s) load(JSON.parse(s)) } catch { /* sem armazenamento: aguarda o editor */ }
if (!project) document.getElementById('empty').style.display = parent !== window ? 'none' : 'grid'
parent !== window && parent.postMessage({ type: 'argus:ready' }, location.origin)

let animOn = true
const t = (id, fn) => document.getElementById(id).addEventListener('click', (e) => fn(e.currentTarget.classList.toggle('on')))
t('t-anim', (on) => { animOn = on; document.getElementById('t-anim').textContent = on ? '⏸ Animação' : '▶ Animação' })
t('t-labels', (on) => (document.getElementById('labels').style.display = on ? '' : 'none'))
t('t-roof', (on) => roof && (roof.visible = on))
document.getElementById('t-usd').addEventListener('click', () => {
  usdEnabled = !usdEnabled
  try { localStorage.setItem(USD_KEY, usdEnabled ? 'on' : 'off') } catch { /* preferência só nesta sessão */ }
  usdStatus()
  if (usdEnabled && usdState === 'off') loadUsdModels()
  else if (project) build(project)
})
usdStatus()

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight) })
const clock = new THREE.Clock()
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1)
  if (project) {
    if (animOn) {
      stepAgents(dt)
      for (const c of conveyorItems) {
        c.u = (c.u + dt * 0.4 / c.len) % 1
        const p = -c.len / 2 + c.u * c.len, lx = c.along ? p : 0, lz = c.along ? 0 : p
        c.m.position.set(c.f.cx + lx * Math.cos(c.f.th) + lz * Math.sin(c.f.th), 0.97, c.f.cz - lx * Math.sin(c.f.th) + lz * Math.cos(c.f.th)); c.m.rotation.y = c.f.th
      }
    }
    for (const a of agents) { a.g.position.set(a.x, 0, a.z); a.g.rotation.y = a.th }
    if (mode === 'walk') updateWalker(dt)
    if (mode === 'drive') updateUser(dt)
    updateCamera()
    if (controls.enabled) controls.update()
    updateAlert(dt); drawMinimap()
  }
  renderer.render(scene, camera); labelRenderer.render(scene, camera)
})
window.__viewer = { cam: (c, t) => { camera.position.set(...c); controls.target.set(...t); controls.update() }, screenOf: (id) => { const i = objInfo.find((q) => q.id === id); if (!i) return null; const v = new THREE.Vector3(i.f.cx, i.h / 2, i.f.cz).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight } }, selected: () => selectedId, load, setMode, stats: () => stats, agents: () => agents, user, keys, pallets: () => pallets, slots: () => slots, carrying: () => carrying, hint: () => hint }
</script>
</body>
</html>
