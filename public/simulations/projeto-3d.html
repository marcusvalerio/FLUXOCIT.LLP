<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Projeto em 3D — ARGUS.LLP</title>
<style>
  :root { --panel: rgba(15, 23, 42, .86); --line: rgba(148, 163, 184, .25); --text: #e2e8f0; --muted: #94a3b8; --accent: #2563EB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { padding: 2px 8px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  button { background: rgba(51, 65, 85, .75); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(71, 85, 105, .9); }
  button.on { background: var(--accent); border-color: var(--accent); }
  #modes { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; max-width: calc(100vw - 16px); overflow-x: auto; }
  #info { position: fixed; top: 8px; left: 8px; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; z-index: 4; }
  #info h1 { font-size: 14px; margin: 0 0 6px; }
  #info dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 0; }
  #info dt { color: var(--muted); } #info dd { margin: 0; font-weight: 600; text-align: right; }
  #info .warn { margin-top: 8px; color: #fcd34d; font-size: 12px; }
  #info .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #alert { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: rgba(220, 38, 38, .92); font-weight: 600; z-index: 6; display: none; }
  #alert.warn { background: rgba(217, 119, 6, .92); }
  #help { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); z-index: 5; max-width: calc(100vw - 230px); text-align: center; }
  #help kbd { background: #334155; color: #fff; border-radius: 4px; padding: 0 5px; font: 11px monospace; }
  #minimap { position: fixed; right: 8px; bottom: 8px; width: 210px; height: 140px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); z-index: 5; }
  #joy { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); z-index: 7; display: none; touch-action: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #forkBtns { position: fixed; right: 16px; bottom: 160px; display: none; flex-direction: column; gap: 8px; z-index: 7; }
  #forkBtns button { padding: 12px 16px; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.8); display: none; z-index: 5; pointer-events: none; }
  #empty { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 8; background: #0f172a; }
  #empty a { color: #93c5fd; }
  @media (max-width: 760px) { #info { display: none; } #info.open { display: block; top: 56px; } #help { display: none; } #minimap { width: 140px; height: 94px; top: 56px; bottom: auto; } #infoBtn { display: inline-block !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="crosshair"></div>
<header id="modes">
  <button data-mode="orbit" class="on">🛰 Órbita</button>

<div id="joy"><div id="knob"></div></div>
<div id="forkBtns"><button id="forkUp">▲ Garfo</button><button id="forkDown">▼ Garfo</button></div>
<div id="empty"><div><h2>Nenhum projeto carregado</h2><p>Abra um projeto no ARGUS.LLP e use a aba <b>3D</b>.<br>
  Ou veja a <a href="armazem-3d.html">simulação de demonstração</a>.</p></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
// Visualizador 3D de um projeto do ARGUS.LLP (Layout + Fluxo). Recebe o projeto do editor via
// postMessage (aba 3D) ou, aberto em outra aba, do localStorage. O editor continua 2D: isto só lê.
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js'

const STORAGE_KEY = 'argus:3d-project'
const ROOF_H = 9
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const wrap = (a) => ((((a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI
const angDiff = (a, b) => wrap(a - b)
function hash(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
function rng(seed) { let a = seed; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }

// Cores do app (src/shared/lib/colors.ts e types/flow.ts)
const AREA_COLORS = { receiving: '#0D9488', shipping: '#2563EB', picking: '#7C3AED', staging: '#D97706', quarantine: '#DC2626',
  returns: '#DB2777', storage: '#B45309', circulation: '#64748B', administrative: '#0EA5E9', custom: '#334155', inspection: '#0EA5E9' }
const AREA_LABELS = { receiving: 'Recebimento', shipping: 'Expedição', picking: 'Picking', staging: 'Staging', quarantine: 'Quarentena',
  returns: 'Devolução', storage: 'Armazenagem', circulation: 'Circulação', administrative: 'Administrativo', custom: 'Área', inspection: 'Conferência' }
const AREA_SUBTYPE = { 'area-picking': 'picking', 'area-staging': 'staging', 'area-inspection': 'inspection', 'area-shipping': 'shipping', 'area-receiving': 'receiving' }
const PALLET_COLORS = ['#c8a97e', '#b98f5c', '#d6c29a', '#a77b4f', '#9fb7c9', '#bfa58a']

// ---------------------------------------------------------------- renderer / cena
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight)
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.getElementById('app').appendChild(renderer.domElement)
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') })
labelRenderer.setSize(innerWidth, innerHeight)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#a9bccf')
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 1000)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49
scene.add(new THREE.HemisphereLight('#ffffff', '#6b7280', 1.6))
const sun = new THREE.DirectionalLight('#ffffff', 1.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048)
scene.add(sun, sun.target)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: '#7c8a76' }))
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground)

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o })
let root = new THREE.Group(); scene.add(root)
let W = 40, D = 30
let obstacles = []   // OBB: { cx, cz, hw, hl, c, s }
let agents = []
let conveyorItems = []
let roof = null
let stats = { objects: 0, positions: 0, routes: 0, unlinked: 0 }

// ---------------------------------------------------------------- caixas instanciadas (estática inteira em 1 draw call)
const unitBox = new THREE.BoxGeometry(1, 1, 1)
let boxes = []
const _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color()
function objFrame(o) {
  const w = o.width / 100, l = o.length / 100
  const th = -THREE.MathUtils.degToRad(o.rotationDeg || 0)
  const cx = (o.x + o.width / 2) / 100, cz = (o.y + o.length / 2) / 100
  return { w, l, th, cx, cz, m: new THREE.Matrix4().compose(_p.set(cx, 0, cz), _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), th), _s.set(1, 1, 1)) }
}
function B(f, x, y, z, sx, sy, sz, color) {   // caixa no referencial do objeto; y = base
  const local = new THREE.Matrix4().compose(_p.set(x, y + sy / 2, z), _q.identity(), _s.set(sx, sy, sz))
  boxes.push([f.m.clone().multiply(local), color])
}
function flushBoxes() {
  const im = new THREE.InstancedMesh(unitBox, M('#ffffff'), Math.max(1, boxes.length))
  boxes.forEach(([m, c], i) => { im.setMatrixAt(i, m); im.setColorAt(i, _c.set(c)) })
  im.count = boxes.length; im.castShadow = im.receiveShadow = true
  root.add(im)
}
function obstacle(f, pad = 0) { obstacles.push({ cx: f.cx, cz: f.cz, hw: f.w / 2 + pad, hl: f.l / 2 + pad, c: Math.cos(f.th), s: -Math.sin(f.th) }) }
function label(text, color, x, y, z) {
  const el = document.createElement('div'); el.className = 'lbl'; el.textContent = text; el.style.background = color
  const o = new CSS2DObject(el); o.position.set(x, y, z); root.add(o)
}
function floorPlane(f, color, opacity, y = 0.012) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(f.w, f.l), new THREE.MeshStandardMaterial({ color, transparent: true, opacity, depthWrite: false }))
  m.rotation.set(-Math.PI / 2, f.th, 0, 'YXZ')
  m.position.set(f.cx, y, f.cz); m.receiveShadow = true; root.add(m)
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(f.w, f.l)), new THREE.LineBasicMaterial({ color }))
  e.rotation.copy(m.rotation); e.position.set(f.cx, y + 0.003, f.cz); root.add(e)
  return m
}

// ---------------------------------------------------------------- construtores por objectType
function rackLike(o, f, kind) {
  const R = rng(hash(o.id))
  const shelf = kind === 'shelf'
  const levels = clamp(+o.properties?.levels || 3, 1, 10)
  const levelH = shelf ? 0.5 : 1.55
  const bays = clamp(+o.properties?.bays || Math.max(1, Math.round(f.w / (shelf ? 1.2 : 2.7))), 1, 60)
  const bayLen = f.w / bays, H = levels * levelH + (shelf ? 0.1 : 0.4)
  const upr = shelf ? '#64748b' : '#1e3a8a', beam = shelf ? '#94a3b8' : kind === 'flow-rack' ? '#16a34a' : '#f97316'
  for (let b = 0; b <= bays; b++) for (const z of [-f.l / 2 + 0.05, f.l / 2 - 0.05]) B(f, -f.w / 2 + b * bayLen, 0, z, 0.09, H, 0.09, upr)
  for (let b = 0; b < bays; b++) {
    const bx = -f.w / 2 + b * bayLen + bayLen / 2
    for (let lv = 1; lv <= levels; lv++) for (const z of [-f.l / 2 + 0.05, f.l / 2 - 0.05]) B(f, bx, lv * levelH - 0.1, z, bayLen - 0.1, 0.1, 0.07, beam)
    if (shelf) for (let lv = 0; lv < levels; lv++) B(f, bx, lv * levelH + 0.02, 0, bayLen - 0.1, 0.03, f.l - 0.1, '#cbd5e1')
    const per = shelf ? 2 : Math.max(1, Math.floor(bayLen / 1.3)), slotW = bayLen / per
    for (let lv = 0; lv < levels; lv++) for (let k = 0; k < per; k++) {
      stats.positions += shelf ? 0 : 1
      if (R() > 0.72) continue
      const x = bx - bayLen / 2 + slotW * (k + 0.5), y = lv * levelH + (lv ? 0 : 0.0)
      const pw = Math.min(1.0, slotW - 0.15), pd = Math.min(1.2, f.l - 0.1), col = PALLET_COLORS[Math.floor(R() * PALLET_COLORS.length)]
      if (shelf) { B(f, x, y + 0.05, 0, pw * 0.8, 0.35, pd * 0.7, col); continue }
      B(f, x, y, 0, pw, 0.14, pd, '#8B5E34')
      B(f, x, y + 0.14, 0, pw - 0.05, Math.min(1.0 + R() * 0.2, levelH - 0.35), pd - 0.1, kind === 'cantilever' ? '#78716c' : col)
    }
  }
  obstacle(f)
}
function vehicle(f, color, kind) {
  const g = makeForklift(color, kind)
  g.g.position.set(f.cx, 0, f.cz); g.g.rotation.y = f.th + Math.PI / 2   // no 2D o comprimento da máquina é a largura do objeto
  root.add(g.g); obstacle(f)
}
function build(project) {
  scene.remove(root); root = new THREE.Group(); scene.add(root)
  // remover o grupo não dispara 'removed' nos rótulos filhos: os elementos HTML ficariam órfãos
  document.querySelectorAll('#labels .lbl').forEach((el) => el.remove())
  boxes = []; obstacles = []; agents = []; conveyorItems = []; stats = { objects: 0, positions: 0, routes: 0, unlinked: 0 }
  W = Math.max(1, project.widthM || 40); D = Math.max(1, project.heightM || 30)
  const objects = project.objects || []
  stats.objects = objects.length

  // casca do galpão: planos com face só para dentro (de fora a câmera vê o interior)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M('#d6d3cd'))
  floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2, 0, D / 2); floor.receiveShadow = true; root.add(floor)
  const pts = []
  for (let x = 0; x <= W + 1e-6; x += 1) pts.push(x, 0.004, 0, x, 0.004, D)
  for (let z = 0; z <= D + 1e-6; z += 1) pts.push(0, 0.004, z, W, 0.004, z)
  const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3))
  root.add(new THREE.LineSegments(gg, new THREE.LineBasicMaterial({ color: '#c4bfb5' })))
  for (const [len, rot, x, z] of [[W, 0, W / 2, 0], [W, Math.PI, W / 2, D], [D, Math.PI / 2, 0, D / 2], [D, -Math.PI / 2, W, D / 2]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, ROOF_H), M('#e5e7eb')); m.rotation.y = rot; m.position.set(x, ROOF_H / 2, z); m.receiveShadow = true; root.add(m)
  }
  roof = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M('#9ca3af')); roof.rotation.x = Math.PI / 2; roof.position.set(W / 2, ROOF_H, D / 2)
  roof.visible = document.getElementById('t-roof').classList.contains('on'); root.add(roof)

  for (const o of objects) {
    const f = objFrame(o), t = o.objectType
    const area = t === 'area' ? (o.properties?.areaType || 'custom') : AREA_SUBTYPE[t]
    if (area) {
      const color = AREA_COLORS[area] || '#334155'
      floorPlane(f, color, 0.25)
      label(o.name || AREA_LABELS[area] || 'Área', color, f.cx, 0.3, f.cz)
      continue
    }
    switch (t) {
      case 'rack': case 'drive-in': case 'push-back': case 'flow-rack': case 'cantilever': case 'shelf': rackLike(o, f, t); break
      case 'storage-block': {
        const R = rng(hash(o.id)), nx = Math.max(1, Math.floor(f.w / 1.1)), nz = Math.max(1, Math.floor(f.l / 1.3)), lv = clamp(+o.properties?.levels || 3, 1, 6)
        for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
          const h = 1 + Math.floor(R() * lv); stats.positions += lv
          for (let k = 0; k < h; k++) {
            const x = -f.w / 2 + (i + 0.5) * f.w / nx, z = -f.l / 2 + (j + 0.5) * f.l / nz
            B(f, x, k * 1.2, z, 1.0, 0.14, 1.2, '#8B5E34'); B(f, x, k * 1.2 + 0.14, z, 0.95, 1.0, 1.1, PALLET_COLORS[(i + j + k) % PALLET_COLORS.length])
          }
        }
        obstacle(f); break
      }
      case 'pallet': case 'box': case 'container': case 'cage-pallet': {
        const h = t === 'container' ? 2.6 : t === 'box' ? Math.min(f.w, f.l) : 1.1
        if (t === 'pallet') { B(f, 0, 0, 0, f.w, 0.14, f.l, '#8B5E34'); B(f, 0, 0.14, 0, f.w * 0.95, 1.0, f.l * 0.92, PALLET_COLORS[hash(o.id) % PALLET_COLORS.length]) }
        else B(f, 0, 0, 0, f.w, h, f.l, t === 'container' ? '#b45309' : t === 'cage-pallet' ? '#9ca3af' : '#c8a97e')
        obstacle(f); break
      }
      case 'wall': B(f, 0, 0, 0, f.w, +o.properties?.height || 6, f.l, '#cbd5e1'); obstacle(f); break
      case 'column': B(f, 0, 0, 0, f.w, ROOF_H, f.l, '#a8a29e'); B(f, 0, 0, 0, f.w + 0.04, 1.2, f.l + 0.04, '#facc15'); obstacle(f); break
      case 'door': case 'gate': {
        const along = f.w >= f.l, span = Math.max(f.w, f.l), h = t === 'gate' ? 4.5 : 2.4, post = 0.12
        const c = t === 'gate' ? '#475569' : '#16a34a'
        for (const s of [-1, 1]) along ? B(f, s * (span / 2 - post / 2), 0, 0, post, h, Math.max(f.l, 0.15), c) : B(f, 0, 0, s * (span / 2 - post / 2), Math.max(f.w, 0.15), h, post, c)
        along ? B(f, 0, h - 0.15, 0, span, 0.15, Math.max(f.l, 0.15), c) : B(f, 0, h - 0.15, 0, Math.max(f.w, 0.15), 0.15, span, c)
        break
      }
      case 'dock': B(f, 0, 0, 0, f.w, 0.12, f.l, '#57534e'); B(f, 0, 0.12, 0, f.w * 0.9, 0.02, f.l * 0.9, '#facc15'); label(o.name || 'Doca', '#2563EB', f.cx, 1, f.cz); break
      case 'stairs': { const n = 10; for (let i = 0; i < n; i++) B(f, 0, 0, -f.l / 2 + (i + 0.5) * f.l / n, f.w, (i + 1) * 0.18, f.l / n, '#94a3b8'); obstacle(f); break }
      case 'conveyor': {
        const along = f.w >= f.l, len = Math.max(f.w, f.l), wid = Math.min(f.w, f.l)
        along ? B(f, 0, 0.7, 0, f.w, 0.1, f.l, '#334155') : B(f, 0, 0.7, 0, f.w, 0.1, f.l, '#334155')
        for (let k = 0; k <= Math.floor(len / 1.5); k++) { const p = -len / 2 + k * len / Math.max(1, Math.floor(len / 1.5)); along ? B(f, p, 0, 0, 0.06, 0.7, wid * 0.9, '#64748b') : B(f, 0, 0, p, wid * 0.9, 0.7, 0.06, '#64748b') }
        const n = Math.max(1, Math.floor(len / 1.4))
        for (let k = 0; k < n; k++) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.35, 0.45), M(PALLET_COLORS[k % PALLET_COLORS.length])); m.castShadow = true; root.add(m)
          conveyorItems.push({ m, f, along, len, u: k / n })
        }
        obstacle(f); break
      }
      case 'sorting-bench': case 'packing-table': {
        B(f, 0, 0.85, 0, f.w, 0.06, f.l, t === 'packing-table' ? '#d6d3d1' : '#94a3b8')
        for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) B(f, sx * (f.w / 2 - 0.05), 0, sz * (f.l / 2 - 0.05), 0.05, 0.85, 0.05, '#475569')
        obstacle(f); break
      }
      case 'scale': B(f, 0, 0, 0, f.w, 0.1, f.l, '#475569'); break
      case 'label-printer': case 'rf-scanner': B(f, 0, 0, 0, 0.05, 1.0, 0.05, '#475569'); B(f, 0, 1.0, 0, f.w, Math.min(0.3, f.l), f.l, '#1f2937'); break
      case 'forklift': case 'reach-truck': case 'order-picker': vehicle(f, t === 'forklift' ? '#f59e0b' : t === 'reach-truck' ? '#2563EB' : '#16a34a', t); break
      case 'pallet-jack': case 'platform-cart': case 'tug':
        B(f, 0, 0, 0, f.w, t === 'tug' ? 1.1 : 0.2, f.l, t === 'tug' ? '#ea580c' : '#64748b')
        if (t !== 'tug') B(f, -f.w / 2 + 0.05, 0, 0, 0.06, 1.0, f.l * 0.8, '#1f2937')
        obstacle(f); break
      case 'corridor': case 'traffic-lane': case 'flow-route': case 'intersection': {
        floorPlane(f, t === 'flow-route' ? '#2563EB' : '#eab308', t === 'intersection' ? 0.3 : 0.12, 0.014); break
      }

function drawMinimap() {
  const s = Math.min(mm.width / (W * 1.08), mm.height / (D * 1.08)), ox = (mm.width - W * s) / 2, oy = (mm.height - D * s) / 2
  mctx.clearRect(0, 0, mm.width, mm.height); mctx.fillStyle = '#d6d3cd'; mctx.fillRect(ox, oy, W * s, D * s)
  mctx.fillStyle = '#1e3a8a'
  for (const b of obstacles) {
    mctx.save(); mctx.translate(ox + b.cx * s, oy + b.cz * s); mctx.rotate(Math.atan2(b.s, b.c)); mctx.fillRect(-b.hw * s, -b.hl * s, 2 * b.hw * s, 2 * b.hl * s); mctx.restore()
  }
  const dot = (x, z, th, color, r) => { mctx.save(); mctx.translate(ox + x * s, oy + z * s); mctx.rotate(-th); mctx.fillStyle = color; mctx.beginPath(); mctx.moveTo(0, r * 1.6); mctx.lineTo(r, -r); mctx.lineTo(-r, -r); mctx.closePath(); mctx.fill(); mctx.restore() }
  for (const a of agents) dot(a.x, a.z, a.th, a.machine ? '#2563EB' : '#0D9488', 4.5)
  if (mode === 'drive') dot(user.x, user.z, user.th, '#dc2626', 5)
  dot(walker.x, walker.z, walker.yaw, '#f97316', 4.5)
}

// ---------------------------------------------------------------- dados: editor → visualizador
let project = null, firstBuild = true
function load(p) {
  if (!p || !Array.isArray(p.objects)) return
  project = p
  document.getElementById('empty').style.display = 'none'
  build(p)
  if (firstBuild) { resetCamera('orbit'); setMode('orbit'); firstBuild = false }
}
addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.data?.type !== 'argus:project') return
  load(e.data.project)
})
try { const s = localStorage.getItem(STORAGE_KEY); if (s) load(JSON.parse(s)) } catch { /* sem armazenamento: aguarda o editor */ }
if (!project) document.getElementById('empty').style.display = parent !== window ? 'none' : 'grid'
parent !== window && parent.postMessage({ type: 'argus:ready' }, location.origin)

let animOn = true
const t = (id, fn) => document.getElementById(id).addEventListener('click', (e) => fn(e.currentTarget.classList.toggle('on')))
t('t-anim', (on) => { animOn = on; document.getElementById('t-anim').textContent = on ? '⏸ Animação' : '▶ Animação' })
t('t-labels', (on) => (document.getElementById('labels').style.display = on ? '' : 'none'))
t('t-roof', (on) => roof && (roof.visible = on))

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight) })
const clock = new THREE.Clock()
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1)
  if (project) {
    if (animOn) {
      stepAgents(dt)
      for (const c of conveyorItems) {
        c.u = (c.u + dt * 0.4 / c.len) % 1
        const p = -c.len / 2 + c.u * c.len, lx = c.along ? p : 0, lz = c.along ? 0 : p
        c.m.position.set(c.f.cx + lx * Math.cos(c.f.th) + lz * Math.sin(c.f.th), 0.97, c.f.cz - lx * Math.sin(c.f.th) + lz * Math.cos(c.f.th)); c.m.rotation.y = c.f.th
      }
    }
    for (const a of agents) { a.g.position.set(a.x, 0, a.z); a.g.rotation.y = a.th }
    if (mode === 'walk') updateWalker(dt)
    if (mode === 'drive') updateUser(dt)
    updateCamera()
    if (controls.enabled) controls.update()
    updateAlert(dt); drawMinimap()
  }
  renderer.render(scene, camera); labelRenderer.render(scene, camera)
})
window.__viewer = { load, setMode, stats: () => stats, agents: () => agents }
</script>
